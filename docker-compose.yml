version: "3.8"
services:
  db:
    image: postgres:17.4
    container_name: recruitment-task-db
    environment:
      POSTGRES_DB: recruitment-task
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: